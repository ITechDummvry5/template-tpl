<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name · ID Card</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;background:radial-gradient(circle at 30% 20%,#5566ff,#2f3bd6 70%);font-family:Verdana,Geneva,sans-serif;color:#fff;overflow:hidden}

/* everything inside the card is sized in em, so it scales as one piece */
.scene{font-size:clamp(9px,2.6vw,13px);width:32em;aspect-ratio:1.586;perspective:1200px}
.tilt{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-14deg));transition:transform .2s ease-out;animation:bob 5s ease-in-out infinite}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.4,1);cursor:pointer}
.flip.on{transform:rotateY(180deg)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}

.face{position:absolute;inset:0;overflow:hidden;border-radius:1.1em;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 0 .12em rgba(255,255,255,.55),.9em .9em 0 rgba(30,40,170,.55),0 2em 3em rgba(10,15,80,.45)}
.front{background:linear-gradient(152deg,#c9cdff,#6d7bff 55%,#4353ff)}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,#5566ff,#2f3bd6)}

/* front */
.head{display:flex;align-items:center;justify-content:space-between;padding:.9em 1.3em;background:rgba(255,255,255,.28);border-bottom:.12em solid rgba(255,255,255,.7)}
.head b{font-size:.95em;letter-spacing:.22em}
.chip{width:2.4em;height:1.8em;border-radius:.35em;background:linear-gradient(135deg,#ffe9a8,#e0b84f);box-shadow:inset 0 0 0 .1em rgba(120,90,10,.35)}
.main{display:flex;gap:1.4em;padding:1.3em 1.3em 0}
.photo{flex:0 0 8em;height:9.6em;display:grid;place-items:center;border:.18em solid #fff;border-radius:.6em;background:linear-gradient(135deg,#8a96ff,#5d6bff);box-shadow:.5em .5em 0 #5b69ff}
.photo b{font-size:2.8em}
.info{min-width:0}
.lbl{display:block;margin-top:.7em;font-size:.68em;letter-spacing:.16em;text-transform:uppercase;color:#e3e6ff}
.lbl:first-child{margin-top:0}
.name{margin:.1em 0 0;font-size:1.9em;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.val{font-size:1.02em;font-weight:700}
.foot{position:absolute;left:1.3em;right:1.3em;bottom:1em;display:flex;align-items:center;justify-content:space-between}
.icons{display:flex;gap:.7em}
.icons svg{width:1.7em;height:1.7em;fill:#fff;opacity:.95}
.id{font-size:.8em;letter-spacing:.18em;opacity:.9}

/* back */
.stripe{height:3.2em;margin-top:1.6em;background:#0d1140}
.links{display:flex;flex-direction:column;gap:.55em;padding:1.2em 1.3em 0}
.links a{display:flex;align-items:center;gap:.8em;padding:.55em .9em;border:.14em solid #fff;border-radius:.5em;color:#fff;font-size:1.05em;text-decoration:none;box-shadow:.3em .3em 0 #5b69ff;transition:transform .2s,box-shadow .2s,background-color .2s,color .2s}
.links a:hover{transform:translate(.2em,.2em);box-shadow:.1em .1em 0 #5b69ff;background:#fff;color:#4353ff}
.links a:focus-visible{outline:.2em solid #fff;outline-offset:.2em}
.links svg{width:1.4em;height:1.4em;fill:currentColor;flex:0 0 auto}
.links span{margin-left:auto;font-size:.8em;opacity:.8}
.code{position:absolute;left:1.3em;right:1.3em;bottom:.9em;height:1.7em;background:repeating-linear-gradient(90deg,#fff 0 .12em,transparent .12em .3em,#fff .3em .55em,transparent .55em .68em,#fff .68em .78em,transparent .78em .98em);opacity:.9;border-radius:.1em}

.hint{margin:0;font-size:13px;color:#e3e6ff;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){.tilt{animation:none}.flip{transition:none}}
</style>
</head>
<body>

<div class="scene">
  <div class="tilt" id="tilt">
    <div class="flip" id="flip" tabindex="0" role="button" aria-label="Flip the card">

      <!-- FRONT -->
      <div class="face front">
        <div class="head"><b>DEVELOPER ID</b><span class="chip"></span></div>
        <div class="main">
          <div class="photo"><b>YN</b></div>
          <div class="info">
            <span class="lbl">Name</span>
            <h1 class="name">Your Name</h1>
            <span class="lbl">Role</span>
            <span class="val">Web Developer</span>
            <span class="lbl">Member since</span>
            <span class="val">2026</span>
          </div>
        </div>
        <div class="foot">
          <div class="icons" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-1 .4-1.7 1.8-1.7h1.6V3.8c-.3 0-1.3-.2-2.5-.2-2.6 0-4.3 1.6-4.3 4.4v2.5H7.3v3.3h2.8V22z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0122 7.5v9a5.5 5.5 0 01-5.5 5.5h-9A5.5 5.5 0 012 16.5v-9A5.5 5.5 0 017.5 2zm0 2A3.5 3.5 0 004 7.5v9A3.5 3.5 0 007.5 20h9a3.5 3.5 0 003.5-3.5v-9A3.5 3.5 0 0016.5 4zM12 7a5 5 0 110 10 5 5 0 010-10zm0 2a3 3 0 100 6 3 3 0 000-6zm5.3-3.2a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z"/></svg>
          </div>
          <span class="id">ID 0001 2026</span>
        </div>
      </div>

      <!-- BACK -->
      <div class="face back">
        <div class="stripe"></div>
        <nav class="links" aria-label="Social links">
          <a href="https://github.com/yourusername" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>GitHub<span>@yourusername</span></a>
          <a href="https://facebook.com/yourusername" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-1 .4-1.7 1.8-1.7h1.6V3.8c-.3 0-1.3-.2-2.5-.2-2.6 0-4.3 1.6-4.3 4.4v2.5H7.3v3.3h2.8V22z"/></svg>Facebook<span>/yourusername</span></a>
          <a href="https://instagram.com/yourusername" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 2h9A5.5 5.5 0 0122 7.5v9a5.5 5.5 0 01-5.5 5.5h-9A5.5 5.5 0 012 16.5v-9A5.5 5.5 0 017.5 2zm0 2A3.5 3.5 0 004 7.5v9A3.5 3.5 0 007.5 20h9a3.5 3.5 0 003.5-3.5v-9A3.5 3.5 0 0016.5 4zM12 7a5 5 0 110 10 5 5 0 010-10zm0 2a3 3 0 100 6 3 3 0 000-6zm5.3-3.2a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z"/></svg>Instagram<span>@yourusername</span></a>
        </nav>
        <div class="code" aria-hidden="true"></div>
      </div>

    </div>
  </div>
</div>
<p class="hint">Click the card to flip it</p>

<script>
(() => {
  const flip = document.getElementById('flip'), tilt = document.getElementById('tilt');
  const toggle = () => flip.classList.toggle('on');
  flip.addEventListener('click', e => { if (!e.target.closest('a')) toggle(); });
  flip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && matchMedia('(hover:hover)').matches) {
    addEventListener('pointermove', e => {
      const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
      tilt.style.setProperty('--ry', (-14 + x * 22).toFixed(1) + 'deg');
      tilt.style.setProperty('--rx', (8 - y * 18).toFixed(1) + 'deg');
    });
  }
})();
</script>
</body>
</html>
