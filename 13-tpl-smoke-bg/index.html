  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;background:#05000a}
</style>

<!--
  USAGE: add the data-smoke attribute to ANY element (body, a card, a hero, a section...).
  The smoke fills that element and sits behind its content automatically.

    <body data-smoke>                       -> full-page fixed background
    <div class="card" data-smoke>...</div>  -> smoke inside a card (follows its border-radius)

  OPTIONS (all optional, set as attributes on the same element):
    data-smoke-deep="#0f0024"   shadow color
    data-smoke-mid="#6b0d9e"    body color
    data-smoke-glow="#f21a99"   highlight color
    data-smoke-speed="1"        animation speed
    data-smoke-density="1"      smoke thickness
    data-smoke-height="0.85"    how far up it reaches (0 to 1)
    data-smoke-scale="0.6"      render resolution (lower = faster)

  TO COPY: take the <script> block at the bottom. Nothing else is required.
-->

<body data-smoke>
