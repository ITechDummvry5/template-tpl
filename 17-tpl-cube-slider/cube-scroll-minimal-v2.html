<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Cube</title>
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:light dark;--bg:#f5f5f7;--face:#e8e8ed;--fg:#6e6e73}
@media (prefers-color-scheme:dark){:root{--bg:#000;--face:#1d1d1f;--fg:#86868b}}
body{background:var(--bg)}

/* The cube, fixed in the middle of the screen */
#scene{position:fixed;inset:0;display:grid;place-items:center;perspective:1200px}
#cube{--s:min(70vw,70vh,520px);width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;transform:rotateX(90deg);will-change:transform}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;display:grid;place-items:center;background:var(--face)}
.face span{font:700 clamp(2rem,8vw,4rem)/1 system-ui,sans-serif;letter-spacing:-.04em;color:var(--fg);opacity:.35}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.face[data-face=front]{transform:translateZ(calc(var(--s)/2))}
.face[data-face=back]{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.face[data-face=right]{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.face[data-face=left]{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.face[data-face=top]{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.face[data-face=bottom]{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}

/* Gives the page its scroll length: 100vh per image */
#track{height:calc(var(--n) * 100vh)}
</style>
</head>
<body>

<div id="scene"><div id="cube"></div></div>
<div id="track"></div>

<script>
/* EDIT HERE: your 6 images (top, front, right, back, left, bottom).
   Leave a path as "" to show a numbered placeholder face. */
const IMAGES = [
  "https://picsum.photos/seed/cube1/900/900",
  "https://picsum.photos/seed/cube2/900/900",
  "https://picsum.photos/seed/cube3/900/900",
  "https://picsum.photos/seed/cube4/900/900",
  "https://picsum.photos/seed/cube5/900/900",
  "https://picsum.photos/seed/cube6/900/900"
];

const N = IMAGES.length;
const FACES = ["top","front","right","back","left","bottom"];
const STOPS = [{rx:90,ry:0},{rx:0,ry:0},{rx:0,ry:-90},{rx:0,ry:-180},{rx:0,ry:-270},{rx:-90,ry:-360}];

const cube = document.getElementById('cube');
const root = document.documentElement;
root.style.setProperty('--n', N);

cube.innerHTML = FACES.map((f, i) =>
  `<div class="face" data-face="${f}"><span>${String(i + 1).padStart(2, '0')}</span>` +
  (IMAGES[i] ? `<img src="${IMAGES[i]}" alt="" onerror="this.remove()">` : '') + `</div>`
).join('');

let maxS = 1, tgt = 0, sm = 0;
const measure = () => { maxS = Math.max(1, root.scrollHeight - innerHeight); };
measure();
addEventListener('resize', measure);

const ease = t => t < .5 ? 2*t*t : -1 + (4 - 2*t)*t;

function draw() {
  const t = sm * (N - 1), i = Math.min(Math.floor(t), N - 2), f = ease(t - i);
  const a = STOPS[i], b = STOPS[i + 1];
  cube.style.transform = `rotateX(${a.rx + (b.rx - a.rx) * f}deg) rotateY(${a.ry + (b.ry - a.ry) * f}deg)`;
}

let last = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, .05); last = now;
  tgt = Math.min(1, Math.max(0, scrollY / maxS));
  sm += (tgt - sm) * (1 - Math.exp(-dt * 8));   // smooth follow
  draw();
})(last);
</script>
</body>
</html>
