<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>410 · Removed</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#4353ff}

/* ===================== 410 ISOMETRIC (copy CSS from here) ===================== */
.w-clearfix::before,.w-clearfix::after{content:" ";display:table}
.w-clearfix::after{clear:both}
.w-preserve-3d{transform-style:preserve-3d}

.fs{position:relative;width:100%;height:100vh;background-color:#4353ff;perspective:9999px}
.hold-illustration{position:absolute;left:0;top:50%;right:0;display:block;width:60%;max-width:700px;margin:0 auto;perspective:9999px;transform:translate(0,-50%) rotateX(55deg) rotateY(-3deg) rotateZ(49deg)}
.background{position:relative;display:block;width:54%;height:55vw;max-height:750px;margin:0 auto;border-top-left-radius:10px;border-top-right-radius:10px;background-image:linear-gradient(152deg,#b4baff,#4353ff 74%);perspective:999px}
.top-bar{position:relative;left:0;top:0;right:0;width:100%;height:22px;border-bottom:2px solid #4353ff;border-top-left-radius:10px;border-top-right-radius:10px;background-color:#b4baff}
.dot{position:absolute;left:10px;top:8px;width:5px;height:5px;border-radius:100%;background-color:#fff}
.dot._2{left:20px}
.dot._3{left:30px}
.left-strip{position:absolute;left:0;top:22px;z-index:0;width:38%;height:100%;background-image:linear-gradient(180deg,#9aa3ff,rgba(67,83,255,.07) 37%)}

.text-like-box{position:relative;width:38%;padding:20px 25px 25px;float:left}
.text-like-box.bottom{top:-250px;width:31%;padding-top:0;clear:left;background-image:none}
.text-like-box.bottom.v2{top:-32px;width:80%;margin-left:30%;float:none;clear:none}
.text{width:15%;float:left;font-family:Verdana,Geneva,sans-serif;color:#fff;font-size:21px;line-height:30px}
.text.wide{width:34%;font-weight:700;letter-spacing:-.02em}
.straight-line{position:relative;width:83%;height:2px;margin-left:2%;padding-top:22px;float:left;border-bottom:2px solid #fff}
.straight-line.short{width:62%}
.straight-line-full{position:relative;width:100%;height:2px;margin-top:7px;clear:left;border-radius:1px;background-color:#fff}
.straight-line-full.shortened{width:50%}

.square-tower{position:relative;top:-20px;width:35%;height:150px;float:left;clear:left;perspective:999px}
.play-box{position:relative;left:0;top:50%;right:0;z-index:4;display:block;overflow:visible;width:65px;height:65px;margin:0 auto;border:2px solid #fff;border-radius:0 3px 3px;background-image:linear-gradient(135deg,rgba(116,129,255,.7),rgba(166,173,255,.7));transform:translate(0,-50%) translate3d(-79px,-61px,70px)}
.play-box__play-icon{position:absolute;left:0;top:50%;right:0;display:block;width:15px;margin:0 auto;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:15px solid #fff;transform:translate(0,-50%)}
.play-box__top-bar{position:relative;left:-2px;top:-6px;z-index:0;width:35%;height:5px;border-top-left-radius:3px;border-top-right-radius:3px;background-color:#fff}
.play-box__square-1{position:absolute;left:0;top:50%;right:0;z-index:3;display:block;width:65px;height:65px;margin:0 auto;border-radius:3px;background-color:rgba(178,185,255,.7);transform:translate(0,-50%) translate3d(-62px,-44px,50px)}
.play-box__square-2{position:absolute;left:0;top:50%;right:0;z-index:2;display:block;width:65px;height:65px;margin:0 auto;border-radius:3px;background-color:#929bff;background-image:linear-gradient(315deg,#929bff,#828dff);transform:translate3d(-42px,-92%,50px)}
.play-box__square-bottom{position:absolute;left:0;top:50%;right:0;z-index:0;display:block;width:65px;height:65px;margin:0 auto;border-radius:3px;background-image:linear-gradient(335deg,rgba(96,109,255,.62) 11%,rgba(96,109,255,.33) 48%);transform:translate(-18px,-57%)}
.bottom-line-bar{position:relative;top:-230px;width:25%;height:200px;margin-left:8%;clear:left;border-radius:5px;background-image:linear-gradient(185deg,#7782ff,rgba(99,112,255,0) 86%)}

.mountain-photo-parent{position:relative;left:-20px;top:0;width:62%;padding:25px;float:left;perspective:9999px}
.mountain-photo__real-deal{position:relative;left:0;top:-70px;right:0;display:block;overflow:hidden;width:80%;height:100px;margin:0 auto;border-radius:1px;background-image:linear-gradient(315deg,rgba(232,235,255,.9),#b4baff);box-shadow:29px 29px 0 6px rgba(107,119,255,.8)}
.mountain-photo__real-deal.small{top:30px;width:90%;height:60px;float:left;clear:left;box-shadow:none;opacity:.51}
.mountain-photo__real-deal.small.no-mountains{top:50px;opacity:.21}
.mountain{position:relative;left:-25px;top:65px;right:0;display:block;width:70%;height:80%;margin:0 auto;border-radius:5px;background-image:linear-gradient(180deg,#dee2ff,#b6bdff);transform:rotate(45deg)}
.mountain._2{position:absolute;left:25px;top:58px;right:0;width:90%;height:110%;background-image:linear-gradient(90deg,hsla(0,0%,100%,.7),rgba(182,189,255,.66) 51%)}
.mountain.shrunked{left:-6px;top:31px}
.mountain.shrunked._2{left:25px;top:30px;right:0}
.arrow-line{position:absolute;left:0;right:0;bottom:54px;display:block;width:2px;height:42px;margin:0 auto;background-color:#fff}
.arrow-line-small{position:absolute;left:-4px;right:0;bottom:0;width:2px;height:10px;background-color:#fff;transform:rotate(-45deg)}
.arrow-line-small.v2{left:4px;transform:rotate(45deg)}

.tri-parent{position:relative;left:0;top:-50px;right:0;width:62%;padding:30px;float:left;perspective:9999px}
.column{position:relative;z-index:10;width:29.11%;margin-right:1.11%;margin-left:3.11%;padding:12px;float:left;border-radius:5px;background-image:linear-gradient(135deg,#c0c5ff,#adb3ff);box-shadow:11px 11px 0 0 #5e6bff}
.digit{display:block;height:26px;margin-bottom:2px;text-align:center;font:700 26px/26px Verdana,Geneva,sans-serif;color:#fff}
.string-block{position:relative;top:30px;width:30%;float:left}
.square{position:relative;left:0;top:0;right:0;display:block;width:25px;height:25px;margin:0 auto;border-radius:1px;background-color:#d9ddff;box-shadow:11px 11px 0 -1px #5b69ff}
.square._2{top:60px;z-index:1}
.square._3{top:-10px}
.connector-bar{position:absolute;left:0;top:22px;right:0;display:block;width:2px;height:25px;margin:0 auto;background-color:#d9ddff;box-shadow:11px 11px 0 0 #5b69ff}

.circle-tower{position:absolute;left:0;top:-66px;width:80px;height:80px;perspective:9999px}
.circle-top{position:absolute;left:-8px;top:-4px;right:0;z-index:5;display:block;width:40px;height:40px;margin:0 auto;border-radius:100%;background-color:rgba(213,216,255,.8);background-image:linear-gradient(315deg,hsla(0,0%,100%,.22),hsla(0,0%,100%,0));transform:translate3d(0,0,10px)}
.circle-top._2{left:25px;top:10px;right:0;z-index:4}
.circle-top._3{left:47px;top:23px;z-index:3;background-color:transparent;background-image:linear-gradient(180deg,#5d6bff,hsla(0,0%,100%,.76));box-shadow:23px 19px 0 0 rgba(67,83,255,.26);transform:none}
.overflow-hidden{position:absolute;left:0;top:0;right:0;overflow:hidden;width:100%;height:100%}

/* message (flat, in the same white Verdana) */
.msg{position:fixed;left:6vw;bottom:8vh;z-index:20;max-width:min(360px,80vw);font-family:Verdana,Geneva,sans-serif;color:#fff}
.msg h1{margin:0;font-size:clamp(56px,9vw,120px);line-height:1;font-weight:700;letter-spacing:-.02em}
.msg p{margin:12px 0 22px;font-size:16px;line-height:26px}
.btn{display:inline-block;padding:5px 10px;border:2px solid #fff;border-radius:5px;color:#fff;text-decoration:none;transition:background-color .3s,color .3s}
.btn:hover{background-color:#fff;color:#4353ff}
.btn:focus-visible,.overflow-hidden:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* load-in animation (replaces the Webflow interactions) */
.js [data-ix]{transition:opacity .6s ease,transform .8s cubic-bezier(.22,1,.36,1),width .9s ease}
.js [data-ix^="loading-line"]{width:0}
.js [data-ix^="column-hover"],.js [data-ix="hovering-on-load-string-block"],.js [data-ix="arrow-load"]{opacity:0}
.js [data-ix^="pop-in"]{opacity:0;transform:scale(.8)}
.js [data-ix="mountain-slide-in"]{transform:translate(140px,0) rotate(45deg)}
.js [data-ix="mountain-slide-in-from-left"]{transform:translate(-100px,0) rotate(45deg)}
.js [data-ix="play-icon-on-load"]{transform:translate(-100px,-50%)}
.ready [data-ix^="loading-line"]{width:100%}
.ready .shortened[data-ix^="loading-line"]{width:50%}
.ready [data-ix^="column-hover"],.ready [data-ix="hovering-on-load-string-block"],.ready [data-ix="arrow-load"]{opacity:1}
.ready [data-ix^="pop-in"]{opacity:1;transform:none}
.ready [data-ix="mountain-slide-in"],.ready [data-ix="mountain-slide-in-from-left"]{transform:rotate(45deg)}
.ready [data-ix="play-icon-on-load"]{transform:translate(0,-50%)}
.mountain-photo__real-deal.small.ready-fix{opacity:.51}

@media (max-width:991px){
  .fs{overflow:hidden}
  .hold-illustration{width:90%}
  .background{height:63vw}
}
@media (max-width:767px){
  .fs{min-height:100vh}
  .hold-illustration{position:relative;top:50%;width:100%}
  .text-like-box.bottom,.bottom-line-bar{top:-280px}
  .circle-tower{left:-3%;top:-56px}
  .circle-top{width:30px;height:30px}
  .circle-top._3{left:52px}
  .digit{height:18px;font-size:18px;line-height:18px}
  .msg{left:0;right:0;margin:0 auto;bottom:6vh;text-align:center}
}
@media (max-width:479px){
  .hold-illustration{top:0;transform:rotateX(55deg) rotateY(-3deg) rotateZ(49deg) scale(.7)}
  .background{width:100%;height:107vw}
}
/* ===================== (copy CSS to here) ===================== */
</style>
</head>
<body>

<!-- ===================== 410 ISOMETRIC (copy script from here) ===================== -->
<script>
(() => {
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.classList.add('js');
  document.querySelectorAll('[data-ix]').forEach((el, i) => {
    el.style.transitionDelay = reduce ? '0s' : i * 35 + 'ms';   // stagger the load-in
  });
  const go = () => root.classList.add('ready');
  reduce ? go() : requestAnimationFrame(() => requestAnimationFrame(go));
})();
</script>
