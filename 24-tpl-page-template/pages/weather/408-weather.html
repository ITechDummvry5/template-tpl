<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>408 - Weather Delay</title>


<style>
body{margin:0;background:#336;font:300 14px/18px Roboto,sans-serif}
*,:after,:before{box-sizing:border-box}
.cloud:before,.cloud:after,.cloud .dtl:before,.cloud .dtl:after,
.statue .hair:before,.statue .hair:after,.statue .crown .arrow:before,.statue .crown .arrow:after,
.statue .body:before,.statue .body:after,.statue .hand:before,.statue .hand:after,
.statue .torch-glow:before,.statue .torch-glow:after,.statue .torch:after,
.statue .cloth:before,.statue .cloth:after,.statue .cloth-wrap:before,.statue .cloth-wrap:after,
.statue .base .top:before,.statue .base .top:after{content:'';position:absolute}
.statue,.statue .head,.statue .hair,.statue .crown .arrow,.statue .torch,.statue .body,.statue .cloth,
.statue .base .bar,.statue .base .top,.statue .cloth-wrap{margin:auto;position:relative}

.box-wrap{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(#336,#000)}
.box,.box-inner,.flip{max-width:600px;max-height:350px;width:100%;height:100%}
.box-inner{margin:auto;position:relative}
.box{margin:80px auto 0;position:relative}
.flip{position:absolute}

.city{width:100%;bottom:40px;position:absolute}
.clouds,.cloud,.cloud .dtl{position:absolute}
.clouds{z-index:-1;width:inherit}
.cloud{width:75px;height:15px;border-radius:15px;background:#4b5d8b;animation:move-cloud 10s linear infinite}
.cloud .dtl{bottom:0;left:-4px;width:24px;height:24px;border-radius:50%;background:inherit}
.cloud .dtl:before{top:-4px;left:22px;width:14px;height:20px;border-radius:12px;background:inherit}
.cloud .dtl:after{left:34px;width:34px;bottom:2px;height:34px;border-radius:50%;background:inherit}
.cloud-1{top:15px;left:80px}
.cloud-2{top:-25px;right:200px;background:#5a4a8a;animation-duration:13s}
.cloud-3{top:40px;width:55px;right:240px;background:#3a3f7a;animation-duration:15s}
.cloud-3 .dtl{width:18px;height:18px}
.cloud-3 .dtl:before{top:-12px;left:14px;width:28px;height:28px;border-radius:50%;background:inherit}
.cloud-3 .dtl:after{bottom:0;left:38px;width:24px;height:24px}
@keyframes move-cloud{0%,100%{transform:translateX(100px)}50%{transform:translateX(-50px)}}

.statue{left:-70px}
.statue .head{z-index:2;width:18px;height:22px;margin-bottom:4px;background:#66cccd;border-radius:12px 12px 12px 12px/12px 12px 22px 22px;box-shadow:0 2px 4px rgba(0,0,0,.38)}
.statue .hair{width:inherit;height:inherit;overflow:hidden;border-radius:inherit;border-top:2px solid #006f75}
.statue .hair:before,.statue .hair:after{top:-8px;width:16px;height:16px;border-radius:50%;background:#389699}
.statue .hair:before{left:-7px}
.statue .hair:after{right:-5px}
.statue .crown{width:inherit;height:inherit;position:absolute}
.statue .crown .arrow,.statue .crown .arrow:before,.statue .crown .arrow:after{width:0;height:0;position:absolute;border:2px solid transparent;border-bottom:16px solid #66cccd}
.statue .crown .arrow.arrow-1{top:-7px;left:-8px;transform:rotate(-70deg)}
.statue .crown .arrow.arrow-1:before{top:1px;left:-8px;transform:rotate(-18deg)}
.statue .crown .arrow.arrow-1:after{right:-9px;transform:rotate(25deg)}
.statue .crown .arrow.arrow-2{top:-17px;left:50%;margin-left:-2px}
.statue .crown .arrow.arrow-2:before,.statue .crown .arrow.arrow-2:after{display:none}
.statue .crown .arrow.arrow-3{top:-7px;right:-8px;transform:rotate(70deg)}
.statue .crown .arrow.arrow-3:before{top:1px;right:-8px;transform:rotate(18deg)}
.statue .crown .arrow.arrow-3:after{left:-9px;transform:rotate(-25deg)}

.statue .body{width:30px;height:90px;background:#66cccd;border-top-right-radius:4px}
.statue .body:before,.statue .body:after{width:0;bottom:0;height:0;border:4px solid transparent}
.statue .body:before{left:-3px;border-bottom:18px solid #66cccd}
.statue .body:after{right:-3px;border-bottom:24px solid #66cccd}
.statue .hands{width:inherit;height:inherit;position:absolute}
.statue .hand{position:absolute}
.statue .hand.left{top:-45px;width:30px;left:-16px;height:52px;border:7px solid #66cccd;border-top:none;border-right:none;border-bottom-left-radius:35px 45px;border-top-left-radius:5px 30px}
.statue .hand.left:before{top:-4px;z-index:1;left:-8px;width:10px;height:14px;box-shadow:0 0 2px;background:#66cccd;border-radius:4px 4px 5px 5px/4px 4px 8px 8px}
.statue .hand.left:after{left:-4px;z-index:1;width:18px;bottom:-5px;height:14px;background:#66cccd;transform:rotate(30deg)}
.statue .hand.right{top:4px;z-index:2;width:15px;right:-12px;height:40px;background:#4b9296;transform:rotate(35deg)}
.statue .hand.right:after{top:12px;left:10px;width:9px;height:13px;background:#66cccd;border-radius:4px 4px 5px 0/4px 4px 8px 0}

.statue .torch-glow,.statue .torch{position:absolute}
.statue .torch-glow{top:-50px;left:-38px;width:72px;height:72px}
.statue .torch-glow:before,.torch-glow:after{z-index:-1;width:inherit;height:inherit;border-radius:50%;animation:torch-glow 2s linear infinite}
.statue .torch-glow:before{color:#494651;background:radial-gradient(#444 0,rgba(68,68,68,.15) 100%)}
.statue .torch-glow:after{top:50%;left:50%;width:48px;height:48px;margin:-24px 0 0 -24px;color:#63543f;background:radial-gradient(#963 0,rgba(68,68,68,.15) 100%)}
@keyframes torch-glow{0%,100%{box-shadow:0 0 20px;transform:scale(1)}50%{box-shadow:none;transform:scale(1.1)}}
.statue .torch{top:-8px;left:-5px;width:4px;height:22px;background:#4b9296;border-radius:0 0 4px 4px}
.statue .torch:after{top:-5px;left:50%;width:10px;height:5px;margin-left:-5px;background:#4b9296;border-radius:0 0 4px 4px}
.statue .torch .flame{left:-1px;top:-14px;width:8px;height:8px;position:absolute;border-top-right-radius:8px 12px;border-bottom-left-radius:12px 8px;background:linear-gradient(#face3a -4px,#ff9642 100%);transform:rotate(60deg)}

.statue .cloth-wrap{height:100%}
.statue .cloth-wrap:before,.cloth-wrap:after{background:#66cccd}
.statue .cloth-wrap:before{left:2px;top:-11px;width:20px;height:32px;transform:rotate(-80deg)}
.statue .cloth-wrap:after{right:-4px;width:20px;height:20px;transform:rotate(-28deg);border-top-right-radius:4px}
.statue .cloth{width:100%;height:100%;position:absolute}
.statue .cloth:before,.cloth:after{width:0;height:0;z-index:1}
.statue .cloth.cloth-1:before{top:-8px;left:-5px;width:4px;height:14px;background:#46aab3;transform:rotate(32deg)}
.statue .cloth.cloth-1:after{top:2px;left:-10px;border-radius:1px;border:8px solid #66cccd;border-right:14px solid transparent;border-bottom:0;transform:rotate(-70deg) skew(-30deg)}
.statue .cloth.cloth-2:before{top:-2px;left:-2px;width:12px;z-index:0;height:20px;background:#46aab3;transform:rotate(-18deg)}
.statue .cloth.cloth-2:after{left:2px;width:15px;height:35px;background:#66cccd;border-bottom-left-radius:3px 12px;transform:rotate(58deg) skewX(18deg)}
.statue .cloth.cloth-3:before{top:24px;left:-10px;border-radius:1px;border:8px solid #46aab3;border-right:32px solid transparent;border-bottom:3px solid transparent;transform:rotate(-52deg) skew(-28deg)}
.statue .cloth.cloth-3:after{top:30px;left:8px;width:3px;height:35px;background:#46aab3;border-top-left-radius:3px 35px;border-bottom-right-radius:3px 35px;transform:rotate(15deg)}
.statue .cloth.cloth-4:before{top:20px;left:11px;border-radius:1px;border:7px solid #46aab3;border-left:2px solid transparent;border-top:7px solid transparent;border-bottom:42px solid transparent;transform:rotate(-14deg) skewX(-26deg)}
.statue .cloth.cloth-4:after{left:3px;z-index:2;width:15px;bottom:14px;height:10px;background:#66cccd;transform:rotate(-33deg) skewX(20deg)}
.statue .cloth.cloth-5{overflow:hidden}
.statue .cloth.cloth-5:before{width:24px;height:30px;bottom:1px;right:-5px;transform:rotate(60deg);background:linear-gradient(136deg,#46aab3 0,transparent 100%)}
.statue .cloth.cloth-6:before{right:2px;border:10px solid transparent;border-top:4px solid #46aab3;border-right:4px solid #46aab3;border-top-right-radius:4px}
.statue .cloth.cloth-6:after{width:4px;right:-2px;height:30px;bottom:20px;background:#46aab3;border-bottom-right-radius:4px 5px;transform:rotate(-4deg)}

.statue .base .top{width:45px;height:45px;background:linear-gradient(#38999d 0,#3f6564 100%)}
.statue .base .top:before,.base .top:after{left:50%;background:#66cccd}
.statue .base .top:before{height:4px;width:50px;margin-left:-25px}
.statue .base .top:after{top:10px;height:6px;width:54px;margin-left:-27px}
.statue .base .bar{width:66px;height:8px;background:#3f6564}
.statue .base .bar.bot{width:100px}

.rain{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;overflow:hidden;pointer-events:none;animation:blnk 6s linear infinite}
.rain i{position:absolute;bottom:200px;width:1px;height:30px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.6));animation:fall .63s linear infinite}
@keyframes fall{to{margin-top:900px}}
@keyframes blnk{0%,95%,98%{background-color:transparent}96%,99%,100%{background-color:#fff}}

.info{position:absolute;right:0;bottom:0;min-width:180px;z-index:2;text-align:left}
.info .code{font-size:64px;line-height:64px;font-weight:400;color:#ffb347;background:linear-gradient(90deg,#ffc371,#ff5f6d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.info .msg{font-size:24px;margin-top:8px;color:#eef1ff}
.info .sub{font-size:13px;font-weight:400;margin-top:6px;color:#8f9bc7}
.home{position:absolute;right:0;bottom:-70px;z-index:3;padding:0 22px;height:38px;line-height:36px;
	color:#ffc371;font-size:13px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;
	border:1px solid rgba(255,195,113,.6);border-radius:999px;background:rgba(255,195,113,.08);
	transition:background .25s,color .25s,box-shadow .25s}
.home:hover{background:linear-gradient(90deg,#ffc371,#ff5f6d);border-color:transparent;color:#1a1a3a;box-shadow:0 0 18px rgba(255,120,100,.45)}
</style>
</head>
<body>
<div class="box-wrap">
	<div class="rain" id="rain"></div>
	<div class="box-inner">
		<div class="box">
			<div class="flip">
				<div class="city">
					<div class="clouds">
						<div class="cloud cloud-1"><div class="dtl"></div></div>
						<div class="cloud cloud-2"><div class="dtl"></div></div>
						<div class="cloud cloud-3"><div class="dtl"></div></div>
					</div>
					<div class="statue">
						<div class="head">
							<div class="crown">
								<div class="arrow arrow-1"></div>
								<div class="arrow arrow-2"></div>
								<div class="arrow arrow-3"></div>
							</div>
							<div class="hair"></div>
						</div>
						<div class="body">
							<div class="hands">
								<div class="hand left">
									<div class="torch-glow"></div>
									<div class="torch"><div class="flame"></div></div>
								</div>
								<div class="hand right"></div>
							</div>
							<div class="cloth-wrap">
								<div class="cloth cloth-1"></div><div class="cloth cloth-2"></div>
								<div class="cloth cloth-3"></div><div class="cloth cloth-4"></div>
								<div class="cloth cloth-5"></div><div class="cloth cloth-6"></div>
								<div class="cloth cloth-7"></div><div class="cloth cloth-8"></div>
								<div class="cloth cloth-9"></div><div class="cloth cloth-10"></div>
							</div>
						</div>
						<div class="base">
							<div class="top"></div>
							<div class="bar mid"></div>
							<div class="bar bot"></div>
						</div>
					</div>
				</div>
				<div class="info">
<div class="code">408</div>
<div class="msg">Weather Delay</div>
<div class="sub">The request was delayed by the weather.</div>
				</div>
			</div>
		</div>
			<a class="home" href="../../index.html">Go back home</a>

	</div>
</div>
<script>
var h='';
for(var n=0;n<600;n++){h+='<i style="left:'+Math.floor(Math.random()*1900)+'px;top:'+Math.floor(Math.random()*2400-1000)+'px"></i>'}
document.getElementById('rain').innerHTML=h;
</script>
</body>
</html>
