<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pop Up</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <!-- Decorative shapes -->
  <div class="shape-one"></div>
  <div class="shape-two"></div>

  <!-- Wrapper -->
  <div class="container">

    <!-- Header -->
    <div class="header">
      <!-- App Title Here -->
       <h1>PopUp</h1>
    </div>
    <!-- Btn -->
    <button class="btn-grad" onclick="openPopup()" type="submit">
      Submit
    </button>

    <div class="popup" id="popup">
      <img src="favicon.ico" alt="Icon Status">
      <h2>Thank You!</h2>
      <p>Your Details has been Successfully Submit!</p>
      <button type="button" onclick="closePopup()" class="btn-grad">Ok</button>
    </div>



  </div>

  <!-- Footer -->
  <div class="footer">Made by <span>TechDummvry!</span></div>



<script src="js/script.js"></script>
</body>
</html>
