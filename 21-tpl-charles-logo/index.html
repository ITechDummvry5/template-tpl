<!-- ===================== ANIMATION (copy from here) ===================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const svg   = document.querySelector('.Charles svg');
  const parts = gsap.utils.toArray('.Charles svg > *');
  const rand  = (min, max) => Math.random() * (max - min) + min;

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;   // static logo

  // scatter every piece
  parts.forEach(el => gsap.set(el, {
    x: rand(-500, 500), y: rand(-500, 500), rotation: rand(-720, 720),
    scale: 0, opacity: 0, transformOrigin: '50% 50%'
  }));

  // fly them together
  const tl = gsap.timeline();
  tl.to(parts, {
    x: 0, y: 0, opacity: 1, scale: 1, rotation: 0,
    ease: 'power4.inOut', duration: 0.75, stagger: 0.0125
  });

  // slow motion on hover
  svg.addEventListener('mouseenter', () => tl.timeScale(0.15));
  svg.addEventListener('mouseleave', () => tl.timeScale(1));
})();
</script>
